<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxer Calendar - Grid Mockup Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #5865F2; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; margin: 0; }
        .app-container { width: 1400px; height: 850px; background-color: #202225; border-radius: 24px; overflow: hidden; display: flex; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- FAR LEFT SIDEBAR -->
        <div class="w-[72px] bg-[#202225] flex flex-col items-center py-4 space-y-4">
            <div class="w-12 h-12 bg-[#5865F2] rounded-2xl flex items-center justify-center text-white cursor-pointer relative">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                <div class="absolute -left-3 top-1/2 -translate-y-1/2 w-2 h-10 bg-white rounded-r-lg"></div>
            </div>
            <div class="w-12 h-12 bg-[#36393F] rounded-[24px] cursor-pointer"></div>
            <div class="w-12 h-12 bg-[#36393F] rounded-[24px] cursor-pointer"></div>
            
            <div class="mt-auto w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center border-4 border-[#202225] relative">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-[#202225] rounded-full"></div>
            </div>
        </div>

        <!-- INNER SIDEBAR -->
        <div class="w-64 bg-[#2F3136] flex flex-col rounded-tl-xl rounded-bl-xl border-r border-[#202225] relative">
            <div class="p-4 pt-6">
                <div class="bg-[#393C43] text-white px-3 py-2 rounded flex items-center cursor-pointer font-semibold shadow-sm">
                    <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    Calendar
                </div>
            </div>
            <div class="absolute bottom-6 left-6 right-6 bg-[#202225] p-2 rounded flex justify-between items-center cursor-pointer text-white">
                <span class="text-xs text-gray-400 font-bold">× Fluxer Developers</span>
            </div>
        </div>

        <!-- MAIN CALENDAR -->
        <div class="flex-1 bg-[#36393F] flex flex-col border-r border-[#202225]">
            <!-- Header -->
            <div class="h-16 border-b border-[#202225] flex items-center justify-between px-6">
                <div class="flex items-center text-gray-400 cursor-pointer">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    <span class="text-sm font-semibold">Filter</span>
                </div>
                <div class="text-white font-bold text-lg flex items-center cursor-pointer">
                    March 2026
                    <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <div class="flex items-center text-gray-400 cursor-pointer">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span class="text-sm font-semibold">Export</span>
                </div>
            </div>

            <!-- Grid -->
            <div class="flex-1 flex flex-col">
                <div class="grid grid-cols-7 border-b border-[#202225]">
                    <div class="py-3 text-center text-xs font-bold text-gray-500">Monday</div>
                    <div class="py-3 text-center text-xs font-bold text-gray-500">Tuesday</div>
                    <div class="py-3 text-center text-xs font-bold text-gray-200">Wednesday</div>
                    <div class="py-3 text-center text-xs font-bold text-gray-500">Thursday</div>
                    <div class="py-3 text-center text-xs font-bold text-gray-500">Friday</div>
                    <div class="py-3 text-center text-xs font-bold text-gray-500">Saturday</div>
                    <div class="py-3 text-center text-xs font-bold text-gray-500">Sunday</div>
                </div>
                <div class="flex-1" id="calendar-grid">
                    <!-- Javascript will inject the grid here -->
                </div>
            </div>
        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="w-80 bg-[#2F3136] flex flex-col p-4 pt-6 text-white">
            <h2 class="font-bold text-sm mb-4 flex items-center px-2">
                <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Upcoming Events
            </h2>
            
            <div class="bg-[#202225] rounded-xl p-3 flex border border-[#202225]">
                <div class="w-16 h-16 bg-[#5865F2] rounded-lg flex items-center justify-center mr-3 shrink-0">
                    <svg class="w-6 h-6 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div class="flex flex-col justify-center">
                    <div class="text-[10px] text-gray-400 font-bold mb-0.5">Saturday, Mar 28 - 16:00</div>
                    <div class="text-white font-bold text-sm mb-1 leading-tight">Design Meeting</div>
                    <div class="flex -space-x-1 items-center mb-1">
                        <div class="w-3.5 h-3.5 rounded-full bg-red-500 border border-[#202225]"></div>
                        <div class="w-3.5 h-3.5 rounded-full bg-purple-500 border border-[#202225]"></div>
                        <div class="w-3.5 h-3.5 rounded-full bg-green-500 border border-[#202225]"></div>
                        <div class="w-3.5 h-3.5 rounded-full bg-yellow-500 border border-[#202225]"></div>
                        <span class="text-[8px] text-gray-400 font-bold ml-1">+16</span>
                    </div>
                    <div class="text-[10px] text-gray-400 flex items-center">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#5865F2] mr-1"></span> Fluxer Developers
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script to render the grid properly -->
    <script>
        const gridContainer = document.getElementById('calendar-grid');
        let html = '<div class="grid grid-cols-7 grid-rows-5 h-full relative">';
        
        for (let i = 0; i < 35; i++) {
            let content = '';
            let dateNum = (i + 2 > 31) ? i - 29 : i + 2;
            
            if (i === 7) { 
                content = `<span class="text-xs font-bold text-gray-500 ml-3 mt-3 block">9</span>
                           <div class="absolute bottom-4 left-3 right-3 bg-[#393C43] text-gray-300 text-xs px-2.5 py-1.5 rounded-md flex items-start z-20 cursor-pointer shadow-md">
                               <div class="w-2 h-2 rounded-full bg-[#5865F2] mr-2 shrink-0 mt-1"></div> 
                               <span class="line-clamp-2 font-medium tracking-wide leading-tight">Code Review</span>
                           </div>`;
            } else if (i === 16) {
                content = `<span class="w-7 h-7 flex items-center justify-center bg-[#5865F2] text-white text-xs font-bold rounded mt-2 ml-2">25</span>`;
            } else if (i === 26) {
                content = `<span class="text-xs font-bold text-gray-500 ml-3 mt-3 block">28</span>
                           <div class="absolute bottom-4 left-3 right-3 bg-[#393C43] text-white text-xs px-2.5 py-1.5 rounded-md flex items-start shadow-md z-10">
                               <div class="w-2 h-2 rounded-full bg-[#5865F2] mr-2 shrink-0 mt-1"></div> 
                               <span class="line-clamp-2 font-medium tracking-wide leading-tight">Design Meeting</span>
                           </div>`;
            } else {
                content = `<span class="text-xs font-bold text-gray-500 ml-3 mt-3 block">${dateNum}</span>`;
            }
            
            html += `<div class="border-r border-b border-[#202225] relative flex flex-col">${content}</div>`;
        }
        
        html += '</div>';
        gridContainer.innerHTML = html;
    </script>
</body>
</html>
